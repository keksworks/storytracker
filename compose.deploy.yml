# For deployment
services:
  tracker:
    volumes:
      - /var/tracker/attachments:/app/attachments
    environment:
      - ENV=prod
      - XFORWARDED_IP_FROM_END
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - MAIL_FROM
      - SESSION_SECRET
      - OWN_DOMAIN
      - OWN_HOST
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
    networks:
      - proxy
      - default
    labels:
      - caddy=${OWN_HOST}, storytracker.azib.net
      - caddy.reverse_proxy={{upstreams 8080}}
      - caddy.reverse_proxy.trusted_proxies=private_ranges 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
      - caddy.reverse_proxy.lb_retries=5
      - caddy.reverse_proxy.lb_try_interval=500ms
      - caddy.log.output=file /data/${OWN_HOST}.log
      - caddy.log.format=console

  db:
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d

networks:
  proxy:
    external: true
