services:
  tracker:
    logging:
      # view with `journalctl -t ${COMPOSE_PROJECT_NAME}`
      driver: journald
      options:
        tag: "${COMPOSE_PROJECT_NAME}"
    volumes:
      - ./attachments:/app/attachments

  db:
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - 127.0.0.1:5698:5432
